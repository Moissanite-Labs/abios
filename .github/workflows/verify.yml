name: Verify
on:
  push:
    branches: [main, 'release-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Gates and tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dry-run the standalone installer
        run: bash install.sh --target "$RUNNER_TEMP/installed" --dry-run
      - name: Run declared gates
        run: |
          python3 gates/protean-sym2p/check-internal-names.py .
          python3 tests/run-tests.py
      - name: Install bench dependencies
        run: python3 -m pip install -r requirements-bench.txt
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify SYM-3 benchmark (committed tables)
        run: make bench
