name: Verify
on:
  push:
    branches: [main, 'release-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Gates and tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dry-run the standalone installer
        run: bash install.sh --target "$RUNNER_TEMP/installed" --dry-run
      - name: Run declared gates
        run: |
          python3 gates/protean-sym2p/check-internal-names.py .
          python3 tests/run-tests.py
      - name: Run the internal-names gate over pull request commit metadata
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
        shell: bash
        run: |
          git log --format='%an%n%ae%n%cn%n%ce%n%B' \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" |
            python3 gates/protean-sym2p/check-internal-names.py --stdin
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
