name: Verify
on:
  push:
    branches: [main, 'release-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Gates and tests
    # ubuntu-latest (26.04) does not ship setup-python 3.9; keep minimum-Python coverage.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dry-run the standalone installer
        run: bash install.sh --target "$RUNNER_TEMP/installed" --dry-run
      - name: Run declared gates
        run: |
          python3 gates/protean-sym2p/check-internal-names.py .
          python3 tests/run-tests.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify benchmark (Python 3.11+ bench deps)
        if: matrix.python-version != '3.9'
        run: |
          python3 -m pip install -q -r requirements-bench.txt
          PYTHONPATH=scripts/protean-abios python3 bench/run-abios-bench.py
